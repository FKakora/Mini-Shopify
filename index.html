<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mini Store – storefront and admin</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="logo">Mini Store</div>
  <div class="modes" role="group" aria-label="View">
    <button data-mode="shop" aria-pressed="true">Storefront</button>
    <button data-mode="admin" aria-pressed="false">Admin</button>
  </div>
  <button class="btn" id="cartbtn" data-act="opencart" aria-label="Open cart">Cart <i id="cnt">0</i></button>
</header>
<div id="app"></div>
<div class="scrim" id="scrim" data-act="closecart" hidden></div>
<aside class="panel" id="cart" role="dialog" aria-modal="true" aria-label="Cart" hidden></aside>
<div class="toast" id="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
